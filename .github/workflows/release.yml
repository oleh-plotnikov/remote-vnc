name: Release

# Tagging v* builds the package, attaches it to a GitHub release, and publishes
# it to the VS Code Marketplace and to Open VSX. Each publish is skipped with a
# notice until its token exists (VSCE_PAT, OVSX_PAT), so tagging is useful
# before either is set up, and configuring one does not wait on the other.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      # The tag must describe the same version the manifest does, or the release
      # would advertise a package that reports something else once installed.
      - name: Check the tag matches package.json
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $manifest." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Both publishers read their token from the environment, so it never
      # reaches a command line or the logs.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set — skipping the Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --packagePath ./*.vsix

      # Open VSX serves the editors that cannot use Microsoft's Marketplace:
      # VSCodium, Cursor, Windsurf, Gitpod. The namespace has to exist before the
      # first publish and creating it again is harmless, so it is not guarded.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set — skipping the Open VSX publish."
            exit 0
          fi
          publisher=$(node -p "require('./package.json').publisher")
          npx --yes ovsx create-namespace "$publisher" || true
          npx --yes ovsx publish --packagePath ./*.vsix --no-dependencies
