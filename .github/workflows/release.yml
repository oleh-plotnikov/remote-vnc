name: Release

# Tagging v* builds the package, attaches it to a GitHub release, and publishes
# it to the Marketplace. Publishing is skipped with a notice until the VSCE_PAT
# secret exists, so tagging is useful even before that token is set up.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      # The tag must describe the same version the manifest does, or the release
      # would advertise a package that reports something else once installed.
      - name: Check the tag matches package.json
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $manifest." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # vsce reads VSCE_PAT from the environment, so the token never reaches the
      # command line or the logs.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set — skipping the Marketplace publish."
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --packagePath ./*.vsix
